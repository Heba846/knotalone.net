name: Build & deploy to GitHub Pages

on:
  push:
    # GitHub Pages only deploys from the repository's DEFAULT branch.
    # Both are listed so the site ships whichever one is default right now;
    # once `main` is the default branch, the second entry can go.
    branches: [main, claude/kind-allen-mr90gr]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        run: node build/build.mjs
      - name: Check output (links, meta, JSON-LD)
        run: node build/check.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
